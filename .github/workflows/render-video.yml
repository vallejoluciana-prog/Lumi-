name: Render video

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome dependencies
        run: npx remotion browser ensure

      - name: Render DancingGirls
        run: npx remotion render src/index.ts DancingGirls out/dancing-girls.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: dancing-girls-video
          path: out/dancing-girls.mp4
